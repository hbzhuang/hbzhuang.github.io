short_bio: >-
  <p style="max-width: 69ch; text-align: justify; line-height: 1.7;">
    Hi, I am currently a lecture in the <a href="https://ccds.fzu.edu.cn/" target="_blank">College of Computer and Data Science</a> at <a href="https://www.fzu.edu.cn/" target="_blank">Fuzhou University</a>. My research focuses on the design and analysis of algorithms, fault diagnosis, and fault-tolerant computing.  I am passionate about integrating graph theory with real-world applications to solve practical problems. I am always open to collaborative opportunities and welcome discussions with fellow researchers and practitioners.
  </p>

